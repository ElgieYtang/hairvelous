<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Hairvelous</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <a href="/" class="inline-flex items-center gap-2 text-violet-400 mb-8">
      <svg class="h-6 w-6 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M6 15c0-5.25 3.9-9 9-9 1.05 0 2.02.15 3 .45-.6 4.65-3.15 7.5-7.35 8.55M6 15c0 1.95 1.05 3.9 2.85 5.25M6 15c2.1.15 4.35.9 5.85 2.7M11.85 20.25c.45-1.5 1.5-2.85 3-3.75"/></svg>
      <span>Hairvelous</span>
    </a>
    <h1 class="text-2xl font-bold text-white mb-2">Reset password</h1>
    <p class="text-slate-400 mb-6">Use the token from your email and choose a new password (min 6 characters).</p>
    <form id="form" class="space-y-4">
      <div>
        <label for="token" class="block text-sm font-medium text-slate-300 mb-1">Reset token</label>
        <input type="text" id="token" required class="w-full rounded-lg bg-slate-800 border border-slate-600 text-white px-4 py-2.5" placeholder="Paste token from email" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-1">New password</label>
        <input type="password" id="password" required minlength="6" class="w-full rounded-lg bg-slate-800 border border-slate-600 text-white px-4 py-2.5" placeholder="••••••••" />
      </div>
      <div id="msg" class="text-sm hidden"></div>
      <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-medium py-2.5 rounded-lg">Reset password</button>
    </form>
    <p class="mt-4 text-center text-slate-400 text-sm"><a href="/login.html" class="text-violet-400 hover:underline">Back to login</a></p>
  </div>
  <script src="/js/app.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('token')) document.getElementById('token').value = q.get('token');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.classList.add('hidden');
      try {
        await api('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token: document.getElementById('token').value, password: document.getElementById('password').value }),
        });
        msg.classList.remove('hidden');
        msg.className = 'text-sm text-emerald-400';
        msg.textContent = 'Password reset. Redirecting to login…';
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } catch (err) {
        msg.classList.remove('hidden');
        msg.className = 'text-sm text-red-400';
        msg.textContent = err.error || 'Reset failed';
      }
    });
  </script>
</body>
</html>

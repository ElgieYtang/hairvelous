<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Review - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="nav-placeholder"></div>
  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-2">Billing Review</h1>
    <p class="text-slate-400 mb-6">Subscription payment records (GCash/Card) and activation audit trail.</p>
    <div class="mb-4 rounded-xl border border-cyan-500/30 bg-cyan-500/10 px-4 py-3 text-xs text-cyan-100">
      This page is for <strong>subscription plan billing</strong> (Free/Pro). For consultation payment verification and commission split, use <a href="/consultations.html" class="underline text-cyan-200 hover:text-cyan-100">Consultation Finance</a>.
    </div>
    <div class="mb-4">
      <select id="statusFilter" class="rounded-lg bg-slate-800 border border-slate-600 text-white px-3 py-2 text-sm">
        <option value="" selected>All</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <button id="refreshBtn" class="ml-2 bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm">Refresh</button>
    </div>
    <div class="overflow-x-auto rounded-xl border border-slate-700 bg-slate-800/50">
      <table class="w-full text-sm">
        <thead class="text-slate-300 border-b border-slate-700">
          <tr>
            <th class="text-left py-2 px-3">User</th>
            <th class="text-left py-2 px-3">Plan</th>
            <th class="text-left py-2 px-3">Amount</th>
            <th class="text-left py-2 px-3">Method</th>
            <th class="text-left py-2 px-3">Reference</th>
            <th class="text-left py-2 px-3">Receipt</th>
            <th class="text-left py-2 px-3">Status</th>
            <th class="text-left py-2 px-3">Reviewed At</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (!requireAuth() || !requireAdmin()) { /* redirects */ }
    function esc(v) {
      const d = document.createElement('div');
      d.textContent = v || '';
      return d.innerHTML;
    }
    function paymentStatusLabel(v) {
      const s = String(v || '');
      const map = {
        pending: 'Pending Review',
        approved: 'Approved',
        rejected: 'Rejected',
      };
      return map[s] || s || '—';
    }
    async function loadPayments() {
      const status = document.getElementById('statusFilter').value;
      try {
        const data = await api('/billing/payments' + (status ? ('?status=' + encodeURIComponent(status)) : ''));
        const rows = data.payments || [];
        const body = document.getElementById('rows');
        if (!rows.length) {
          body.innerHTML = '<tr><td colspan="8" class="px-3 py-4 text-slate-400">No plan payments found for this filter. Submit a Pro payment from the pricing page to record a transaction.</td></tr>';
          return;
        }
        body.innerHTML = rows.map((p) => `
          <tr class="border-b border-slate-700/60">
            <td class="px-3 py-2">${esc(p.userName)}<div class="text-xs text-slate-500">${esc(p.email)}</div></td>
            <td class="px-3 py-2">${esc(p.planName)}</td>
            <td class="px-3 py-2">₱${Number(p.amountPhp || 0).toFixed(2)}</td>
            <td class="px-3 py-2">${esc((p.method || '').toUpperCase())}</td>
            <td class="px-3 py-2">${esc(p.method === 'card' ? (p.cardReference || p.cardLast4 || '') : (p.gcashReference || ''))}</td>
            <td class="px-3 py-2">${p.receiptPath ? `<a class="text-violet-300 hover:text-violet-200" target="_blank" href="${esc(p.receiptPath)}">View</a>` : '<span class="text-slate-500">None</span>'}</td>
            <td class="px-3 py-2">${esc(paymentStatusLabel(p.status))}</td>
            <td class="px-3 py-2">${esc(p.reviewedAt ? new Date(p.reviewedAt).toLocaleString() : '—')}</td>
          </tr>
        `).join('');
      } catch (err) {
        showToast(err.error || 'Failed to load payments', 'error');
      }
    }
    document.getElementById('refreshBtn').addEventListener('click', loadPayments);
    document.getElementById('statusFilter').addEventListener('change', loadPayments);
    loadPayments();
  </script>
</body>
</html>

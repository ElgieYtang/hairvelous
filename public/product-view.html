<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - Hairvelous</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .panel {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: linear-gradient(160deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.95));
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
    }
    .image-reveal {
      animation: scaleReveal 0.5s ease-out;
      transform-origin: center left;
    }
    .details-reveal {
      animation: slideFadeIn 0.45s ease-out;
    }
    .instant-show {
      animation: none;
    }
    @keyframes scaleReveal {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="disclaimer-placeholder"></div>
  <div id="nav-placeholder"></div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <a href="/recommendations.html" class="inline-flex items-center text-slate-300 hover:text-white text-sm mb-5">← Back to Recommendations</a>

    <section id="product-shell" class="panel p-4 sm:p-6 lg:p-8 grid lg:grid-cols-2 gap-6 lg:gap-8">
      <div class="image-reveal">
        <div class="rounded-xl overflow-hidden border border-slate-700 bg-slate-800/50 aspect-square flex items-center justify-center">
          <img id="product-image" class="w-full h-full object-cover hidden" alt="Product image" />
          <div id="image-placeholder" class="text-slate-500 text-sm">No product image</div>
        </div>
      </div>

      <div class="details-reveal">
        <p id="product-brand" class="text-slate-400 text-sm mb-1"></p>
        <h1 id="product-name" class="text-3xl font-bold text-white mb-2">Product Details</h1>
        <p id="product-price-note" class="text-sm text-slate-400 mb-4">Price may vary by store.</p>

        <div class="flex flex-wrap gap-2 mb-4" id="product-categories"></div>
        <p id="product-expiry" class="text-slate-400 text-sm mb-4"></p>
        <p id="product-description" class="text-slate-300 leading-relaxed mb-6"></p>

        <div class="grid sm:grid-cols-2 gap-3">
          <a id="open-consultation" href="/consultations.html" class="text-center bg-violet-600 hover:bg-violet-500 text-white py-2.5 rounded-lg text-sm font-medium">
            Request Specialist Validation
          </a>
          <a href="/recommendations.html" class="text-center bg-slate-700 hover:bg-slate-600 text-slate-100 py-2.5 rounded-lg text-sm font-medium border border-slate-600">
            Browse Other Products
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (!requireAuth()) { /* redirects */ }

    function esc(v) {
      const d = document.createElement('div');
      d.textContent = v || '';
      return d.innerHTML;
    }

    function expiryText(p) {
      if (p.expiryType === 'date' && p.expiryDate) return 'Expires: ' + p.expiryDate;
      if (p.expiryType === 'period_after_opening' && p.expiryPeriodMonths) return 'Use within ' + p.expiryPeriodMonths + ' months after opening';
      return 'Expiry: Not applicable';
    }

    function applyPrefill(prefill) {
      if (!prefill) return;
      if (prefill.brand) document.getElementById('product-brand').textContent = prefill.brand;
      if (prefill.name) document.getElementById('product-name').textContent = prefill.name;
      document.getElementById('product-expiry').textContent = expiryText(prefill);
      const img = document.getElementById('product-image');
      const placeholder = document.getElementById('image-placeholder');
      if (prefill.imageUrl) {
        img.src = prefill.imageUrl;
        img.classList.remove('hidden');
        placeholder.classList.add('hidden');
      }
    }

    function runImageTransition() {
      const raw = sessionStorage.getItem('productImageTransition');
      if (!raw) return;
      sessionStorage.removeItem('productImageTransition');
      let data;
      try { data = JSON.parse(raw); } catch (_e) { return; }
      if (!data || !data.src) return;

      const target = document.getElementById('product-image');
      if (!target) return;
      const targetRect = target.getBoundingClientRect();
      if (!targetRect.width || !targetRect.height) return;

      const ghost = document.createElement('img');
      ghost.src = data.src;
      ghost.style.position = 'fixed';
      ghost.style.left = `${data.left}px`;
      ghost.style.top = `${data.top}px`;
      ghost.style.width = `${data.width}px`;
      ghost.style.height = `${data.height}px`;
      ghost.style.objectFit = 'cover';
      ghost.style.zIndex = '9999';
      ghost.style.borderRadius = '12px';
      ghost.style.boxShadow = '0 16px 34px rgba(2,6,23,.55)';
      ghost.style.transition = 'all 700ms cubic-bezier(.22,.85,.22,1)';
      document.body.appendChild(ghost);

      target.style.opacity = '0';
      requestAnimationFrame(() => {
        ghost.style.left = `${targetRect.left}px`;
        ghost.style.top = `${targetRect.top}px`;
        ghost.style.width = `${targetRect.width}px`;
        ghost.style.height = `${targetRect.height}px`;
        ghost.style.borderRadius = '10px';
      });
      setTimeout(() => {
        target.style.opacity = '1';
        ghost.remove();
      }, 740);
    }

    async function loadProduct() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        showToast('Missing product ID', 'error');
        return;
      }

      try {
        const data = await api('/products/' + encodeURIComponent(id));
        const p = data.product;
        if (!p) throw new Error('Product not found');

        document.getElementById('product-brand').textContent = p.brand || '';
        document.getElementById('product-name').textContent = p.name || 'Untitled Product';
        document.getElementById('product-expiry').textContent = expiryText(p);
        document.getElementById('product-description').textContent = p.description || 'No description available.';

        const categories = document.getElementById('product-categories');
        const list = Array.isArray(p.categories) ? p.categories : [];
        categories.innerHTML = list.length
          ? list.map((c) => `<span class="px-2.5 py-1 rounded-full text-xs bg-violet-600/30 text-violet-200 border border-violet-500/35">${esc(c)}</span>`).join('')
          : '<span class="text-slate-500 text-sm">No categories</span>';

        const img = document.getElementById('product-image');
        const placeholder = document.getElementById('image-placeholder');
        if (p.imageUrl) {
          img.src = p.imageUrl;
          img.classList.remove('hidden');
          placeholder.classList.add('hidden');
          img.onerror = function () {
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
          };
        }
      } catch (err) {
        showToast(err.error || err.message || 'Failed to load product', 'error');
      }
    }

    (function init() {
      const prefillRaw = sessionStorage.getItem('productViewPrefill');
      if (prefillRaw) {
        try {
          applyPrefill(JSON.parse(prefillRaw));
          document.querySelector('.image-reveal')?.classList.add('instant-show');
          document.querySelector('.details-reveal')?.classList.add('instant-show');
        } catch (_e) {}
      }
      runImageTransition();
      loadProduct();
    })();
  </script>
</body>
</html>

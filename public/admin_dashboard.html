<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – Hairvelous</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="disclaimer-placeholder"></div>
  <div id="nav-placeholder"></div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-0 pb-10 md:pb-12">
    <header class="mb-8 md:mb-10 border-b border-slate-700/60 pb-6">
      <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Admin Dashboard</h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base max-w-2xl">Manage users, products, guides, and system reports.</p>
    </header>

    <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-5 mb-10">
      <a href="/user_management.html" class="bg-slate-800/50 rounded-xl p-5 md:p-6 border border-slate-700/80 hover:border-violet-500/40 hover:bg-slate-800/70 transition-colors block shadow-sm">
        <div class="w-11 h-11 rounded-lg bg-violet-600/25 flex items-center justify-center text-xl mb-3">👥</div>
        <h3 class="text-lg font-semibold text-white mb-1">Users</h3>
        <p class="text-slate-400 text-sm leading-relaxed">Manage user accounts</p>
      </a>
      <a href="/product_management.html" class="bg-slate-800/50 rounded-xl p-5 md:p-6 border border-slate-700/80 hover:border-violet-500/40 hover:bg-slate-800/70 transition-colors block shadow-sm">
        <div class="w-11 h-11 rounded-lg bg-blue-600/25 flex items-center justify-center text-xl mb-3">🛍️</div>
        <h3 class="text-lg font-semibold text-white mb-1">Products</h3>
        <p class="text-slate-400 text-sm leading-relaxed">Manage product catalog</p>
      </a>
      <a href="/guide_management.html" class="bg-slate-800/50 rounded-xl p-5 md:p-6 border border-slate-700/80 hover:border-violet-500/40 hover:bg-slate-800/70 transition-colors block shadow-sm">
        <div class="w-11 h-11 rounded-lg bg-violet-600/25 flex items-center justify-center text-xl mb-3">📖</div>
        <h3 class="text-lg font-semibold text-white mb-1">Guides</h3>
        <p class="text-slate-400 text-sm leading-relaxed">Manage DIY guides</p>
      </a>
      <div class="bg-slate-800/50 rounded-xl p-5 md:p-6 border border-slate-700/80 shadow-sm">
        <div class="w-11 h-11 rounded-lg bg-emerald-600/20 flex items-center justify-center text-xl mb-3">📊</div>
        <h3 class="text-lg font-semibold text-white mb-1">Reports</h3>
        <p class="text-slate-400 text-sm leading-relaxed">View system stats below</p>
      </div>
    </div>

    <section id="reports" class="mb-10">
      <h2 class="text-xl font-semibold text-white mb-4">System Reports</h2>
      <div id="reports-content" class="bg-slate-800/50 rounded-xl p-5 md:p-6 border border-slate-700/80">
        <p class="text-slate-400">Loading...</p>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (!requireAuth() || !requireAdmin()) { /* redirects */ }

    async function loadReports() {
      try {
        const data = await api('/admin/reports');
        const r = data.reports || {};
        document.getElementById('reports-content').innerHTML = `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
            <div class="rounded-lg bg-slate-900/60 border border-slate-600/50 px-4 py-3">
              <p class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Users</p>
              <p class="text-2xl font-bold text-white tabular-nums">${r.totalUsers || 0}</p>
            </div>
            <div class="rounded-lg bg-slate-900/60 border border-slate-600/50 px-4 py-3">
              <p class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Products</p>
              <p class="text-2xl font-bold text-white tabular-nums">${r.totalProducts || 0}</p>
            </div>
            <div class="rounded-lg bg-slate-900/60 border border-slate-600/50 px-4 py-3">
              <p class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Assessments</p>
              <p class="text-2xl font-bold text-white tabular-nums">${r.totalAssessments || 0}</p>
            </div>
            <div class="rounded-lg bg-slate-900/60 border border-slate-600/50 px-4 py-3">
              <p class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Recommendations</p>
              <p class="text-2xl font-bold text-white tabular-nums">${r.totalRecommendations || 0}</p>
            </div>
          </div>
          ${r.note ? '<p class="text-slate-500 text-sm mt-5 pt-4 border-t border-slate-700/60">' + r.note + '</p>' : '<p class="text-slate-500 text-sm mt-5 pt-4 border-t border-slate-700/60">Charts and exports can be connected here in a future iteration.</p>'}
        `;
      } catch (err) {
        showToast(err.error || 'Failed to load reports', 'error');
      }
    }

    loadReports();
  </script>
</body>
</html>
